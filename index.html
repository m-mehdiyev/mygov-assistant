<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mygov Assistant</title>
<meta name="description" content="mygov Assistant — rəqəmsal dövlət xidmətləri üzrə köməkçi.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#075e54;--green2:#128c7e;--chat:#efeae2;--in:#fff;--out:#dcf8c6;--text:#111b21;--muted:#667781;--input:#f0f2f5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
body{min-height:100vh;display:grid;place-items:center;background:#d9dbd5}
.phone{width:min(100vw,430px);height:min(100vh,860px);background:#000;border:7px solid #111;border-radius:48px;padding:5px;box-shadow:0 24px 70px rgba(0,0,0,.28);overflow:hidden}
.screen{width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--chat);display:flex;flex-direction:column}
.statusbar{height:24px;flex:0 0 24px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:0 13px;font-size:10px;font-weight:600}.statusbar .time{margin-right:auto}.status-icons{display:flex;gap:5px}.status-icons span{width:9px;height:7px;border:1.2px solid #fff;border-radius:2px}
.wa-top{height:60px;flex:0 0 60px;background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;padding:7px 9px}
.back{width:25px;height:36px;border:0;background:none;color:#fff;display:grid;place-items:center;padding:0}.back svg{width:21px;height:21px}
.ava{width:40px;height:40px;border-radius:50%;background:#fff;overflow:hidden;flex:0 0 40px;border:1px solid rgba(255,255,255,.45)}.ava img,.mini img{width:100%;height:100%;object-fit:cover;display:block}
.identity{min-width:0;flex:1}.wa-name{font-size:15px;font-weight:700;line-height:19px;display:flex;align-items:center;gap:5px;white-space:nowrap}.verified{width:14px;height:14px;fill:#53bdeb}.wa-status{font-size:11px;line-height:14px;color:rgba(255,255,255,.85)}
.header-actions{display:flex;align-items:center;gap:2px}.header-actions button{width:32px;height:38px;border:0;background:none;color:#fff;display:grid;place-items:center}.header-actions svg{width:19px;height:19px}
.thread{flex:1;min-height:0;overflow-y:auto;padding:10px 8px 12px;display:flex;flex-direction:column;gap:5px;background-color:var(--chat);background-image:url("data:image/svg+xml,%3Csvg width='180' height='180' viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23d2c9bb' stroke-width='1.2' opacity='.38'%3E%3Cpath d='M18 20h18v12H18zM23 15h8v5h-8z'/%3E%3Ccircle cx='86' cy='26' r='8'/%3E%3Cpath d='M122 12l5 8 9 2-6 6 1 9-9-4-8 4 2-9-6-6 9-2z'/%3E%3Cpath d='M18 90c10-9 22-9 31 0v18H18zM26 84h15'/%3E%3Cpath d='M105 78h24v20h-24zM110 73h14v5h-14z'/%3E%3Ccircle cx='155' cy='124' r='11'/%3E%3Cpath d='M147 124h16M155 116v16'/%3E%3Cpath d='M58 132l12-8 12 8-12 8zM70 140v12'/%3E%3Cpath d='M8 155h27M12 149h19v12H12z'/%3E%3C/g%3E%3C/svg%3E")}
.thread::-webkit-scrollbar{width:5px}.thread::-webkit-scrollbar-thumb{background:rgba(84,96,105,.35);border-radius:10px}
.row{display:flex;gap:5px;align-items:flex-end;max-width:89%;position:relative}.row.out{align-self:flex-end}.row.in{align-self:flex-start}.mini{width:24px;height:24px;border-radius:50%;overflow:hidden;background:#fff;flex:0 0 24px;border:1px solid rgba(0,0,0,.08)}
.msg{position:relative;padding:7px 8px 5px;border-radius:8px;font-size:13.5px;line-height:1.42;color:var(--text);white-space:pre-line;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.10);min-width:52px}.row.in .msg{background:var(--in);border-top-left-radius:3px}.row.out .msg{background:var(--out);border-top-right-radius:3px}
.row.in .msg:before{content:"";position:absolute;left:-7px;top:0;border-top:7px solid var(--in);border-left:7px solid transparent}.row.out .msg:after{content:"";position:absolute;right:-7px;top:0;border-top:7px solid var(--out);border-right:7px solid transparent}
.msg b{font-weight:700}.tstamp{font-size:9px;color:var(--muted);float:right;margin:7px 0 -2px 8px;white-space:nowrap}
.golink{display:flex;align-items:center;gap:6px;margin-top:6px;padding:7px 8px;border-radius:6px;background:#f7fbff;border:1px solid #d5e4ec;color:#087e8b;text-decoration:none;font-size:11px;font-weight:600}
.typing{align-self:flex-start;background:#fff;border-radius:8px;border-top-left-radius:3px;padding:8px 11px;display:flex;gap:4px;margin-left:29px;box-shadow:0 1px 1px rgba(0,0,0,.1)}.typing i{width:5px;height:5px;border-radius:50%;background:#86939a;animation:bl 1.1s infinite}.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.wa-bar{flex:0 0 auto;background:#f0f2f5;border-top:1px solid #d7dce0;padding:7px 7px max(7px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:5px}.round-action{width:34px;height:40px;border:0;background:none;color:#54656f;display:grid;place-items:center;flex:0 0 34px}.round-action svg{width:21px;height:21px}
.input-wrap{flex:1;min-width:0;background:#fff;border-radius:22px;min-height:42px;display:flex;align-items:center;padding:0 8px 0 13px;box-shadow:0 1px 1px rgba(0,0,0,.06)}#box{width:100%;border:0;outline:0;background:transparent;padding:10px 5px;font-size:13.5px;color:var(--text);font-family:inherit}#box::placeholder{color:#86939a}.attach{width:31px;height:36px;border:0;background:none;color:#54656f;display:grid;place-items:center}.attach svg{width:20px;height:20px}
#send{width:42px;height:42px;border:0;border-radius:50%;background:var(--green2);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 42px}#send:disabled{opacity:.5}#send svg{width:20px;height:20px}
@media(max-width:520px){body{background:#000}.phone{width:100vw;height:100vh;min-height:100vh;border:0;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}}
</style>
</head>
<body>
<div class="phone"><div class="screen">
<div class="statusbar"><span class="time" id="deviceTime"></span><div class="status-icons"><span></span><span></span><span></span></div></div>
<div class="wa-top">
<button class="back" type="button" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
<div class="ava" id="ava"></div>
<div class="identity"><div class="wa-name">mygov Assistant <svg class="verified" viewBox="0 0 24 24"><path d="M12 2l2.2 2.1 3-.4 1 2.9 2.7 1.4-1 2.9 1 2.9-2.7 1.4-1 2.9-3-.4L12 22l-2.2-2.1-3 .4-1-2.9L3.1 16l1-2.9-1-2.9L6.8 8.8l1-2.9 3 .4z"/></svg></div><div class="wa-status" id="status">onlayn</div></div>
<div class="header-actions">
<button type="button" aria-label="Video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg></button>
<button type="button" aria-label="Zəng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.6 3.5l3.1 3.1-2 2.5a14.8 14.8 0 0 0 7.2 7.2l2.5-2 3.1 3.1-1.8 2.2c-.7.9-2 1.2-3.1.8A19.4 19.4 0 0 1 3.6 6.4c-.4-1.1-.1-2.4.8-3.1z"/></svg></button>
<button type="button" aria-label="Menyu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
</div></div>
<div class="thread" id="thread" aria-live="polite"></div>
<form class="wa-bar" id="form">
<button class="round-action" type="button" aria-label="Emoji"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 10h.01M16 10h.01M8 14c1.2 2 6.8 2 8 0"/></svg></button>
<div class="input-wrap"><input id="box" autocomplete="off" placeholder="Mesaj yazın..."><button class="attach" type="button" aria-label="Əlavə et"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 11.5l-8.9 8.9a5 5 0 0 1-7.1-7.1l9.5-9.5a3.5 3.5 0 0 1 5 5l-9.6 9.6a2 2 0 0 1-2.8-2.8l8.7-8.7"/></svg></button><button class="attach" type="button" aria-label="Kamera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 7h4l1.4-2h5.2L16 7h4v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button></div>
<button id="send" type="submit" aria-label="Göndər"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg></button>
</form></div></div>
<script>function clock(){const d=new Date(),e=document.getElementById('deviceTime');if(e)e.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}clock();setInterval(clock,30000)</script>
<script src="/app.js"></script>
</body></html>
