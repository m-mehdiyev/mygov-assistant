<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mygov Assistant</title>
<meta name="description" content="mygov haqqında suallarınıza sadə və aydın cavablar.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef1f5;--ink:#101828;--muted:#667085;--line:#e4e7ec;--head:#ffffff;--chat:#f6f7f9;--in:#fff;--out:#e9f2ff;--accent:#4d82c5;--shadow:0 28px 80px rgba(15,23,42,.20)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;background:radial-gradient(circle at top,#fff 0,#eef1f5 48%,#e6e9ee 100%);display:grid;place-items:center;padding:24px;color:var(--ink)}
.phone{width:min(100%,430px);height:min(860px,calc(100vh - 48px));min-height:600px;background:#101010;border:8px solid #151515;border-radius:54px;padding:7px;box-shadow:var(--shadow);position:relative}
.phone:before{content:"";position:absolute;top:13px;left:50%;transform:translateX(-50%);width:126px;height:32px;background:#000;border-radius:20px;z-index:4}
.screen{height:100%;border-radius:43px;overflow:hidden;background:var(--chat);display:flex;flex-direction:column;position:relative}
.wa-top{padding:54px 18px 15px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;flex-shrink:0}
.ava{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid #eef0f2}.ava img,.mini img{width:100%;height:100%;object-fit:cover}
.wa-name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}.verified{width:15px;height:15px}.wa-status{font-size:11px;color:var(--muted);margin-top:2px}
.thread{flex:1;overflow-y:auto;padding:18px 14px 16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(#f8fafc,#f4f6f8)}
.row{display:flex;gap:7px;align-items:flex-end;max-width:88%}.row.out{align-self:flex-end}.row.in{align-self:flex-start}.mini{width:24px;height:24px;border-radius:50%;overflow:hidden;background:#fff;flex-shrink:0;border:1px solid var(--line)}
.msg{padding:11px 13px 8px;border-radius:20px;font-size:13.5px;line-height:1.5;box-shadow:0 1px 2px rgba(16,24,40,.05);white-space:pre-line;overflow-wrap:anywhere}.row.in .msg{background:var(--in);border-bottom-left-radius:5px}.row.out .msg{background:var(--out);border-bottom-right-radius:5px}.msg b{font-weight:700}.tstamp{font-size:9.5px;color:#98a2b3;float:right;margin:6px 0 -2px 9px}
.golink{display:flex;align-items:center;gap:8px;margin-top:9px;padding:10px 12px;border-radius:13px;background:#fff;border:1px solid #dbe7f5;color:#346cae;text-decoration:none;font-size:12px;font-weight:700}.golink:hover{text-decoration:underline}
.typing{align-self:flex-start;background:#fff;border-radius:18px;border-bottom-left-radius:5px;padding:12px 14px;display:flex;gap:5px;margin-left:31px}.typing i{width:6px;height:6px;border-radius:50%;background:#98a2b3;animation:bl 1.1s infinite}.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.wa-bar{padding:10px 12px max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(18px);display:flex;gap:8px;border-top:1px solid var(--line);flex-shrink:0}.input-wrap{flex:1;background:#f2f4f7;border-radius:24px;display:flex;align-items:center;padding-left:14px}#box{width:100%;border:0;outline:0;background:transparent;padding:12px 8px;font-size:13.5px;color:var(--ink);font-family:inherit}#box::placeholder{color:#98a2b3}#send{width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px rgba(77,130,197,.30)}#send:disabled{opacity:.45}.foot{display:none}
@media(max-width:520px){body{padding:0;background:#fff}.phone{width:100%;height:100vh;min-height:100vh;border:0;border-radius:0;padding:0;box-shadow:none}.phone:before{top:8px}.screen{border-radius:0}.wa-top{padding-top:48px}}
</style>
</head>
<body>
<div class="phone"><div class="screen">
<div class="wa-top"><div class="ava" id="ava"></div><div><div class="wa-name">mygov Assistant <svg class="verified" viewBox="0 0 24 24" fill="#4d82c5" aria-hidden="true"><path d="M12 2l2.2 2.1 3-.4 1 2.9 2.7 1.4-1 2.9 1 2.9-2.7 1.4-1 2.9-3-.4L12 22l-2.2-2.1-3 .4-1-2.9L3.1 16l1-2.9-1-2.9L6.8 8.8l1-2.9 3 .4z"/></svg></div><div class="wa-status" id="status">onlayn</div></div></div>
<div class="thread" id="thread" aria-live="polite"></div>
<form class="wa-bar" id="form"><div class="input-wrap"><input id="box" autocomplete="off" placeholder="mygov haqqında sualınızı yazın..."></div><button id="send" type="submit" aria-label="Göndər"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg></button></form>
</div></div>
<div class="foot">mygov Assistant</div>
<script src="/app.js"></script>
</body></html>
